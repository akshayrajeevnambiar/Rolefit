<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RoleFit — Sign in</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body class="is-desktop is-frame">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="word">RoleFit</div>
  </header>
  <main class="gate" id="content">
    <h1>Sign in</h1>
    <p class="lede">A local account for this instance. Descriptions and the résumé stay with that account. There are no plans.</p>
    <div class="sleep" role="status">
      <b>Demo</b>
      <p>This demo instance may sleep when idle. The first request can take about a minute.</p>
    </div>
    <form>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" placeholder="you@example.com"></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" placeholder="Password"></label>
      <div class="actions">
        <button class="button button-primary" type="button">Sign in</button>
      </div>
    </form>
    <p class="fine">On a new install, this screen creates the one local account.</p>
  </main>
</body>
</html>
